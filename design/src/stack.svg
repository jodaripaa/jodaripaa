<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Tech stack. Build with: TypeScript, JavaScript, React, Astro, Node.js, Tailwind CSS, MongoDB, Git. Have built projects with: Electron, Next.js, Docker, Gemini API, Playwright, Vitest, PostgreSQL, IndexedDB, Capacitor. Exploring: MediaPipe, gesture recognition, Bluetooth LE, Expo.">
  <style>
    .sans { font-family: 'Inter', 'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, Menlo, monospace; }
    .h { font-size: 15px; letter-spacing: 2px; }
    .n { font-size: 15px; letter-spacing: 2px; fill: {{MUTED}}; }
    .t { font-size: 24px; fill: {{TEXT}}; }
    .t2 { font-size: 24px; fill: {{TEXT}}; opacity: .82; }
    .t3 { font-size: 24px; fill: {{TEXT}}; opacity: .62; }
  </style>
  <rect x="1" y="1" width="1278" height="328" rx="14" fill="{{SURFACE}}" stroke="{{GRID2}}" stroke-width="2"/>

  <!-- nivel: barras de llenado como escala de plano -->
  <g>
    <text class="mono n" x="40" y="48">L1</text>
    <text class="mono h" x="84" y="48" fill="{{ACCENT}}">BUILD WITH</text>
    <rect x="40" y="64" width="360" height="4" rx="2" fill="{{ACCENT}}"/>
    <g class="sans t">
      <text x="40" y="112">TypeScript</text><text x="230" y="112">JavaScript</text>
      <text x="40" y="152">React</text><text x="230" y="152">Astro</text>
      <text x="40" y="192">Node.js</text><text x="230" y="192">Tailwind CSS</text>
      <text x="40" y="232">MongoDB</text><text x="230" y="232">Git · GitHub</text>
    </g>
  </g>

  <path d="M440 40V290" stroke="{{GRID2}}" stroke-width="1.5"/>

  <g>
    <text class="mono n" x="480" y="48">L2</text>
    <text class="mono h" x="524" y="48" fill="{{BLUE}}">HAVE BUILT PROJECTS WITH</text>
    <rect x="480" y="64" width="360" height="4" rx="2" fill="{{GRID2}}"/>
    <rect x="480" y="64" width="240" height="4" rx="2" fill="{{BLUE}}"/>
    <g class="sans t2">
      <text x="480" y="112">Electron</text><text x="670" y="112">Next.js</text>
      <text x="480" y="152">Docker</text><text x="670" y="152">Gemini API</text>
      <text x="480" y="192">Playwright</text><text x="670" y="192">Vitest</text>
      <text x="480" y="232">PostgreSQL</text><text x="670" y="232">IndexedDB</text>
      <text x="480" y="272">Capacitor</text>
    </g>
  </g>

  <path d="M880 40V290" stroke="{{GRID2}}" stroke-width="1.5"/>

  <g>
    <text class="mono n" x="920" y="48">L3</text>
    <text class="mono h" x="964" y="48" fill="{{MUTED}}">EXPLORING</text>
    <rect x="920" y="64" width="320" height="4" rx="2" fill="{{GRID2}}"/>
    <rect x="920" y="64" width="100" height="4" rx="2" fill="{{MUTED}}"/>
    <g class="sans t3">
      <text x="920" y="112">MediaPipe</text>
      <text x="920" y="152">Gesture recognition</text>
      <text x="920" y="192">Bluetooth LE</text>
      <text x="920" y="232">Expo</text>
    </g>
  </g>
</svg>
