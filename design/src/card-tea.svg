<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-label="project_Tea. Prototype. Digital electronics learning for neurodivergent university students. Presented at RedCOLSI National. Astro, React, TypeScript, Gemini API.">
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="{{GRID}}" stroke-width=".5"/></pattern>
  </defs>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, Menlo, monospace; }
    .fig { font-size: 15px; letter-spacing: 1.8px; fill: {{MUTED}}; }
    .title { font-size: 46px; font-weight: 600; letter-spacing: -1px; fill: {{TEXT}}; }
    .body { font-size: 24px; fill: {{TEXT}}; opacity: .8; }
    .k { font-size: 15px; letter-spacing: 1.8px; fill: {{MUTED}}; }
    .v { font-size: 22px; fill: {{TEXT}}; }
    .chip { font-size: 14px; letter-spacing: 1.6px; }
    .stack { font-size: 15px; letter-spacing: 1.6px; fill: {{ACCENT}}; }
  </style>
  <rect x="1" y="1" width="638" height="458" rx="14" fill="{{SURFACE}}" stroke="{{GRID2}}" stroke-width="2"/>
  <rect x="2" y="2" width="636" height="456" rx="14" fill="url(#g)" opacity=".6"/>
  <path d="M2 64H638" stroke="{{GRID2}}" stroke-width="1.5"/>

  <text class="mono fig" x="32" y="40">FIG. 02 — EDUCATION</text>
  <rect x="436" y="20" width="172" height="30" rx="15" fill="none" stroke="{{BLUE}}" stroke-width="1.5"/>
  <circle cx="456" cy="35" r="5" fill="{{BLUE}}"/>
  <text class="mono chip" x="470" y="40" fill="{{BLUE}}">PROTOTYPE</text>

  <text class="sans title" x="32" y="130">project_Tea</text>
  <text class="sans body" x="32" y="174">Digital electronics, designed for</text>
  <text class="sans body" x="32" y="206">neurodivergent students.</text>

  <path d="M32 240H608" stroke="{{GRID2}}" stroke-width="1.5"/>
  <g class="mono">
    <text class="k" x="32" y="276">FOR</text>
    <text class="v" x="160" y="276">Students with ASD level 1</text>
    <text class="k" x="32" y="316">METHOD</text>
    <text class="v" x="160" y="316">Universal Design for Learning</text>
    <text class="k" x="32" y="356">SHOWN</text>
    <text class="v" x="160" y="356">RedCOLSI National</text>
  </g>
  <path d="M2 400H638" stroke="{{GRID2}}" stroke-width="1.5"/>
  <text class="mono stack" x="32" y="434">ASTRO · REACT · TYPESCRIPT · GEMINI API</text>
</svg>
