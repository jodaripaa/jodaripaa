<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Syndes. Co-founder, in development. Software to run a small business, from the counter to the books: point of sale, inventory, sales and finance. Astro, React, TypeScript, Tailwind, MongoDB, MinIO, Playwright.">
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="{{GRID}}" stroke-width=".5"/></pattern>
  </defs>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, Menlo, monospace; }
    .fig { font-size: 15px; letter-spacing: 2px; fill: {{MUTED}}; }
    .title { font-size: 58px; font-weight: 600; letter-spacing: -1.6px; fill: {{TEXT}}; }
    .body { font-size: 25px; fill: {{TEXT}}; opacity: .8; }
    .k { font-size: 14px; letter-spacing: 2px; fill: {{MUTED}}; }
    .v { font-size: 20px; fill: {{TEXT}}; }
    .chip { font-size: 13px; letter-spacing: 1.8px; }
    .stack { font-size: 16px; letter-spacing: 2px; fill: {{ACCENT}}; }
    .nl { font-size: 14px; letter-spacing: 1.6px; fill: {{TEXT}}; }
    .node { fill: {{SURFACE}}; stroke: {{GRID2}}; stroke-width: 1.5; }
    .pulse { stroke-dasharray: 18 600; stroke-dashoffset: 18; animation: flow 4s cubic-bezier(.5,0,.5,1) 6; }
    @keyframes flow { 0% { stroke-dashoffset: 18; opacity: 0; } 6% { opacity: 1; } 80% { stroke-dashoffset: -544; opacity: 1; } 86%, 100% { stroke-dashoffset: -544; opacity: 0; } }
    .lit { opacity: 0; animation: lit 4s ease-out 6; }
    @keyframes lit { 0% { opacity: 0; } 8% { opacity: 1; } 30%, 100% { opacity: 0; } }
    .led { opacity: 0; animation: led 2s ease-out 8; transform-box: fill-box; transform-origin: center; }
    @keyframes led { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
    .grow { stroke-dasharray: 540; animation: grow 1.6s ease-out .3s both; }
    @keyframes grow { from { stroke-dashoffset: 540; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="1" y="1" width="1278" height="438" rx="14" fill="{{SURFACE}}" stroke="{{GRID2}}" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="436" rx="14" fill="url(#g)" opacity=".6"/>
  <path d="M2 64H1278" stroke="{{GRID2}}" stroke-width="1.5"/>

  <text class="mono fig" x="40" y="40">FIG. 01 — PRODUCT · FEATURED</text>
  <rect x="842.75" y="20.75" width="152" height="30" rx="15" fill="none" stroke="{{MUTED}}" stroke-width="1.5"/>
  <text class="mono chip" x="918.75" y="40.5" text-anchor="middle" fill="{{TEXT}}">CO-FOUNDER</text>
  <rect x="1010.75" y="20.75" width="230" height="30" rx="15" fill="none" stroke="{{BLUE}}" stroke-width="1.5"/>
  <circle cx="1031" cy="35.75" r="5" fill="{{BLUE}}"/><circle class="led" cx="1031" cy="35.75" r="5" fill="{{BLUE}}"/>
  <text class="mono chip" x="1045" y="40.5" fill="{{BLUE}}">IN DEVELOPMENT</text>

  <!-- izquierda: producto y flujo de módulos -->
  <text class="sans title" x="40" y="148">Syndes</text>
  <text class="sans body" x="40" y="196">Software to run a small business,</text>
  <text class="sans body" x="40" y="230">from the counter to the books.</text>

  <text class="mono k" x="40" y="282">MODULE FLOW</text>
  <path d="M40 322H584" stroke="{{GRID2}}" stroke-width="1.5"/>
  <path class="pulse" d="M40 322H584" stroke="{{ACCENT}}" stroke-width="3" stroke-linecap="round"/>
  <g stroke="{{MUTED}}" stroke-width="1.5" fill="none"><path d="M167 317l8 5-8 5M311 317l8 5-8 5M455 317l8 5-8 5"/></g>
  <g class="mono">
    <rect class="node" x="40" y="300" width="112" height="44" rx="8"/><text class="nl" x="96" y="327" text-anchor="middle">POS</text>
    <rect class="node" x="184" y="300" width="112" height="44" rx="8"/><text class="nl" x="240" y="327" text-anchor="middle">INVENTORY</text>
    <rect class="node" x="328" y="300" width="112" height="44" rx="8"/><text class="nl" x="384" y="327" text-anchor="middle">SALES</text>
    <rect class="node" x="472" y="300" width="112" height="44" rx="8"/><text class="nl" x="528" y="327" text-anchor="middle">FINANCE</text>
  </g>
  <g fill="none" stroke="{{ACCENT}}" stroke-width="2">
    <rect class="lit" style="animation-delay:.3s" x="40" y="300" width="112" height="44" rx="8"/>
    <rect class="lit" style="animation-delay:1.15s" x="184" y="300" width="112" height="44" rx="8"/>
    <rect class="lit" style="animation-delay:2s" x="328" y="300" width="112" height="44" rx="8"/>
    <rect class="lit" style="animation-delay:2.85s" x="472" y="300" width="112" height="44" rx="8"/>
  </g>

  <!-- derecha: ficha técnica -->
  <path d="M640 96V360" stroke="{{GRID2}}" stroke-width="1.5"/>
  <g class="mono">
    <text class="k" x="680" y="116">ROLE</text>
    <text class="v" x="680" y="146">Co-founder · built with a team</text>
    <text class="k" x="680" y="186">SCOPE</text>
    <text class="v" x="680" y="216">Point of sale · inventory · sales · finance</text>
    <text class="k" x="680" y="256">ACCESS</text>
    <text class="v" x="680" y="286">Roles per business, enforced on the server</text>
    <text class="k" x="680" y="326">QUALITY</text>
    <text class="v" x="680" y="356">E2E tests · accessibility settings</text>
  </g>

  <path d="M2 384H1278" stroke="{{GRID2}}" stroke-width="1.5"/>
  <path class="grow" d="M40 384H580" stroke="{{ACCENT}}" stroke-width="2"/>
  <text class="mono stack" x="40" y="420">ASTRO · REACT · TYPESCRIPT · TAILWIND · MONGODB · MINIO · PLAYWRIGHT</text>
  <path d="M1206 404v20M1240 404v20M1206 414h34" stroke="{{MUTED}}" fill="none" stroke-width="1.5"/>
</svg>
