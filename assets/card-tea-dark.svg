<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-label="project_Tea. Prototype. Digital electronics, designed for neurodivergent students with ASD level 1, using Universal Design for Learning. Presented at RedCOLSI National. Astro, React, TypeScript, Gemini API.">
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#121826" stroke-width=".5"/></pattern>
  </defs>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, Menlo, monospace; }
    .fig { font-size: 15px; letter-spacing: 1.8px; fill: #6B7790; }
    .title { font-size: 46px; font-weight: 600; letter-spacing: -1px; fill: #E8EDF5; }
    .body { font-size: 24px; fill: #E8EDF5; opacity: .8; }
    .k { font-size: 15px; letter-spacing: 1.8px; fill: #6B7790; }
    .v { font-size: 22px; fill: #E8EDF5; }
    .chip { font-size: 14px; letter-spacing: 1.6px; }
    .stack { font-size: 15px; letter-spacing: 1.6px; fill: #00D4FF; }
    .gl { font-size: 11px; letter-spacing: 1px; fill: #6B7790; }
    .sig { stroke-dasharray: 10 120; stroke-dashoffset: 10; animation: sig 3s ease-in-out 6; }
    @keyframes sig { 0% { stroke-dashoffset: 10; opacity: 0; } 5% { opacity: 1; } 30% { stroke-dashoffset: -50; opacity: 1; } 34%, 100% { stroke-dashoffset: -50; opacity: 0; } }
    .lamp { animation: lamp 3s ease-out 6; }
    @keyframes lamp { 0%, 52% { opacity: 0; } 58%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sig { display: none; } }
  </style>
  <rect x="1" y="1" width="638" height="458" rx="14" fill="#0D1119" stroke="#1E2636" stroke-width="2"/>
  <rect x="2" y="2" width="636" height="456" rx="14" fill="url(#g)" opacity=".6"/>
  <path d="M2 64H638" stroke="#1E2636" stroke-width="1.5"/>

  <text class="mono fig" x="32" y="40">FIG. 02 — EDUCATION</text>
  <rect x="436" y="20" width="172" height="30" rx="15" fill="none" stroke="#526BFF" stroke-width="1.5"/>
  <circle cx="456" cy="35" r="5" fill="#526BFF"/>
  <text class="mono chip" x="470" y="40" fill="#526BFF">PROTOTYPE</text>

  <!-- compuerta AND: la electrónica digital que enseña el proyecto -->
  <g>
    <path d="M452 100H500M452 128H500" stroke="#6B7790" stroke-width="1.5"/>
    <path class="sig" d="M452 100H500" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    <path class="sig" style="animation-delay:.15s" d="M452 128H500" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M500 88H522A26 26 0 0 1 522 140H500Z" fill="#0D1119" stroke="#E8EDF5" stroke-width="1.6"/>
    <text class="mono gl" x="521" y="118" text-anchor="middle">AND</text>
    <path d="M548 114H590" stroke="#6B7790" stroke-width="1.5"/>
    <path class="sig" style="animation-delay:.9s" d="M548 114H590" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="598" cy="114" r="7" fill="none" stroke="#00D4FF" stroke-width="1.6"/>
    <circle class="lamp" cx="598" cy="114" r="4" fill="#00D4FF"/>
    <text class="mono gl" x="444" y="104" text-anchor="end">A</text>
    <text class="mono gl" x="444" y="132" text-anchor="end">B</text>
    <text class="mono gl" x="598" y="96" text-anchor="middle">Y</text>
  </g>

  <text class="sans title" x="32" y="130">project_Tea</text>
  <text class="sans body" x="32" y="174">Digital electronics, designed for</text>
  <text class="sans body" x="32" y="206">neurodivergent students.</text>

  <path d="M32 240H608" stroke="#1E2636" stroke-width="1.5"/>
  <g class="mono">
    <text class="k" x="32" y="276">FOR</text>
    <text class="v" x="160" y="276">Students with ASD level 1</text>
    <text class="k" x="32" y="316">METHOD</text>
    <text class="v" x="160" y="316">Universal Design for Learning</text>
    <text class="k" x="32" y="356">SHOWN</text>
    <text class="v" x="160" y="356">RedCOLSI National</text>
  </g>
  <path d="M2 400H638" stroke="#1E2636" stroke-width="1.5"/>
  <text class="mono stack" x="32" y="434">ASTRO · REACT · TYPESCRIPT · GEMINI API</text>
</svg>
