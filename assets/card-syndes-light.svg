<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Syndes. Co-founder, in development. SaaS to run small businesses: point of sale, inventory, sales and finance. Astro, React, Tailwind, MongoDB, MinIO, Playwright.">
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#E9EDF4" stroke-width=".5"/></pattern>
  </defs>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, Menlo, monospace; }
    .fig { font-size: 15px; letter-spacing: 2px; fill: #66728A; }
    .title { font-size: 56px; font-weight: 600; letter-spacing: -1.5px; fill: #090B10; }
    .body { font-size: 25px; fill: #090B10; opacity: .8; }
    .k { font-size: 15px; letter-spacing: 2px; fill: #66728A; }
    .v { font-size: 21px; fill: #090B10; }
    .chip { font-size: 14px; letter-spacing: 1.8px; }
    .stack { font-size: 16px; letter-spacing: 2px; fill: #0077B6; }
  </style>

  <rect x="1" y="1" width="1278" height="398" rx="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="14" fill="url(#g)" opacity=".6"/>
  <path d="M2 64H1278" stroke="#D3DAE6" stroke-width="1.5"/>

  <text class="mono fig" x="40" y="40">FIG. 01 — PRODUCT · FEATURED</text>
  <rect x="1012" y="20" width="228" height="30" rx="15" fill="none" stroke="#3A50E0" stroke-width="1.5"/>
  <circle cx="1032" cy="35" r="5" fill="#3A50E0"/>
  <text class="mono chip" x="1046" y="40" fill="#3A50E0">IN DEVELOPMENT</text>

  <!-- izquierda -->
  <text class="sans title" x="40" y="148">Syndes</text>
  <text class="sans body" x="40" y="196">Software to run a small business,</text>
  <text class="sans body" x="40" y="230">from the counter to the books.</text>
  <text class="mono k" x="40" y="300">ROLE</text>
  <text class="sans v" x="40" y="330">Co-founder · built with a team</text>

  <!-- derecha: ficha -->
  <path d="M640 96V340" stroke="#D3DAE6" stroke-width="1.5"/>
  <g class="mono">
    <text class="k" x="680" y="120">SCOPE</text>
    <text class="v" x="680" y="150">Point of sale · inventory · sales · finance</text>
    <text class="k" x="680" y="200">ACCESS</text>
    <text class="v" x="680" y="230">Roles per business, enforced on the server</text>
    <text class="k" x="680" y="280">QUALITY</text>
    <text class="v" x="680" y="310">E2E tests · accessibility settings</text>
  </g>

  <path d="M2 352H1278" stroke="#D3DAE6" stroke-width="1.5"/>
  <text class="mono stack" x="40" y="382">ASTRO · REACT · TYPESCRIPT · TAILWIND · MONGODB · MINIO · PLAYWRIGHT</text>
  <path d="M1206 366v20M1240 366v20M1206 376h34" stroke="#66728A" fill="none" stroke-width="1.5"/>
</svg>
